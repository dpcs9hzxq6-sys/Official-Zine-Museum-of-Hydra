<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Zine Archive — Official Zine Museum of Hydra</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-title">Official Zine Museum of Hydra</div>
      <div class="brand-sub">Hydra Zine Workshop 2025 by Zoe Lomax</div>
    </div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="process.html">Process</a>
      <a class="active" href="archive.html">Zine Archive</a>
    </nav>
  </header>

  <main class="wrap" id="archivePage">
    <section class="page-head card">
      <h1 class="page-title">Zine Archive</h1>
      <p class="muted">Final Zines 1–19 · click to enlarge</p>
    </section>

    <section class="grid-gallery">
      <figure class="tile"><img class="zine-thumb" data-idx="1" src="assets/archive/1.jpeg" alt="Zine 1"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="2" src="assets/archive/2.jpeg" alt="Zine 2"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="3" src="assets/archive/3.jpeg" alt="Zine 3"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="4" src="assets/archive/4.jpeg" alt="Zine 4"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="5" src="assets/archive/5.jpeg" alt="Zine 5"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="6" src="assets/archive/6.jpeg" alt="Zine 6"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="7" src="assets/archive/7.jpeg" alt="Zine 7"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="8" src="assets/archive/8.jpeg" alt="Zine 8"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="9" src="assets/archive/9.jpeg" alt="Zine 9"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="10" src="assets/archive/10.jpeg" alt="Zine 10"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="11" src="assets/archive/11.jpeg" alt="Zine 11"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="12" src="assets/archive/12.jpeg" alt="Zine 12"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="13" src="assets/archive/13.jpeg" alt="Zine 13"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="14" src="assets/archive/14.jpeg" alt="Zine 14"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="15" src="assets/archive/15.jpeg" alt="Zine 15"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="16" src="assets/archive/16.jpeg" alt="Zine 16"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="17" src="assets/archive/17.jpeg" alt="Zine 17"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="18" src="assets/archive/18.jpeg" alt="Zine 18"></figure>
<figure class="tile"><img class="zine-thumb" data-idx="19" src="assets/archive/19.jpeg" alt="Zine 19"></figure>
    </section>

    <footer class="footer">Zoe Lomax, Hydra 2025, Zine Digital Archive</footer>
  </main>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" aria-label="Close">×</button>
    <div class="lightbox-inner" role="dialog" aria-modal="true" aria-label="Enlarged zine">
      <img id="lightboxImg" alt="Enlarged zine" />
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
